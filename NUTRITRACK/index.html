<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NutriTrack Canteen</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4" style="max-width:450px;width:100%;border-radius:20px;">

        <div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold text-success mb-0">
            ❤️ NutriTrack Canteen
        </h2>

        <small class="text-muted">
            Pilih Cerdas, Hidup Sehat
        </small>

    </div>

</div>

        <p class="text-center text-muted">
            Selamat Datang
        </p>

        <div class="mb-3">
            <label class="form-label">Nama</label>
            <input
    type="text"
    class="form-control"
    id="nama"
    placeholder="Masukkan nama">
        </div>

        <div class="mb-3">
          <label class="form-label">NIS</label>

<input
    type="text"
    class="form-control"
    id="nis"
    placeholder="Masukkan NIS">
        </div>

        <div class="mb-3">
            <label class="form-label">Kelas</label>

          <select
    class="form-select"
    id="kelas">
    <option selected disabled>Pilih Kelas</option>

    <!-- Kelas X -->
    <option>X-1</option>
    <option>X-2</option>
    <option>X-3</option>
    <option>X-4</option>
    <option>X-5</option>
    <option>X-6</option>
    <option>X-7</option>
    <option>X-8</option>
    <option>X-9</option>
    <option>X-10</option>
    <option>X-11</option>
    <option>X-12</option>

    <!-- Kelas XI -->
    <option>XI-1</option>
    <option>XI-2</option>
    <option>XI-3</option>
    <option>XI-4</option>
    <option>XI-5</option>
    <option>XI-6</option>
    <option>XI-7</option>
    <option>XI-8</option>
    <option>XI-9</option>
    <option>XI-10</option>
    <option>XI-11</option>
    <option>XI-12</option>

    <!-- Kelas XII -->
    <option>XII-1</option>
    <option>XII-2</option>
    <option>XII-3</option>
    <option>XII-4</option>
    <option>XII-5</option>
    <option>XII-6</option>
    <option>XII-7</option>
    <option>XII-8</option>
    <option>XII-9</option>
    <option>XII-10</option>
    <option>XII-11</option>
    <option>XII-12</option>
</select>

        </div>
<div class="mb-4">
    <label class="form-label">
        Nomor Absen
    </label>

   <input
    type="number"
    class="form-control"
    id="absen"
    placeholder="Masukkan nomor absen">
</div>
       <button
    class="btn btn-success w-100"
    id="btnMulai">

    Mulai

</button>
    </div>

</div>

<script src="js/index.js"></script>
</body>
</html>
